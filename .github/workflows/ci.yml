---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Check for uncommitted changes
        id: git-diff
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git diff -- dist/ > dist-diff.txt
          git diff --exit-code -- dist/

      - name: Upload generated bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}
          path: dist/index.js
          if-no-files-found: error
          retention-days: 1

      - name: Publish build summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "# Build Report"
            echo

            if [[ "${{ steps.git-diff.outcome }}" == "success" ]]; then
              echo "✅ dist/ is up to date"
            else
              echo "❌ dist/ contains uncommitted changes"
            fi

            echo

            if [[ -s dist-diff.txt ]]; then
              echo "## Differences"
              echo
              echo "<details>"
              echo "<summary>View diff</summary>"
              echo
              echo '```diff'
              cat dist-diff.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "${{ steps.git-diff.outcome }}" == "success" ]]
