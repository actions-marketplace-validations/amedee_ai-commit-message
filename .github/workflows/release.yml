---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
  
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Verify generated bundle
        run: git diff --exit-code -- dist/

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=v$major" >> "$GITHUB_OUTPUT"

      - name: Update major version tag
        if: ${{ steps.version.outputs.major != '0' && !contains(steps.version.outputs.version, '-') }}
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag --force "$MAJOR_TAG" "$GITHUB_SHA"
          git push --force origin "$MAJOR_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" \
              --generate-notes \
              --title "v$VERSION"
          fi
